name: Keep Streamlit Alive

on:
  schedule:
    # S'exécute à 00:00 tous les 3 jours
    # Streamlit Cloud Community hiberne après 7 jours d'inactivité.
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    # Permet de lancer manuellement depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # REMPLACEZ L'URL CI-DESSOUS SI ELLE EST DIFFÉRENTE
          # Votre URL est normalement de la forme : https://<repo-name>.streamlit.app/
          URL="https://carriboard.streamlit.app/"
          echo "Pinging $URL..."
          curl -I -s --fail $URL || echo "L'application semble hors ligne ou l'URL est incorrecte."
